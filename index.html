<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Generador de Planilla de Asistencia - Formato Visual GNM2</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- SheetJS para lectura de GNM1 -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <!-- ExcelJS para exportar con colores de celda y bordes exactos a GNM2 -->
  <script src="https://cdn.jsdelivr.net/npm/exceljs@4.3.0/dist/exceljs.min.js"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased">

  <header class="bg-slate-900 text-white py-10 px-4 shadow-lg">
    <div class="max-w-4xl mx-auto text-center">
      <div class="inline-flex items-center justify-center p-3 bg-emerald-600 rounded-xl mb-3 shadow-md">
        <i data-lucide="file-spreadsheet" class="w-8 h-8 text-white"></i>
      </div>
      <h1 class="text-3xl font-extrabold">Generador de Planillas GNM2</h1>
      <p class="text-slate-300 text-sm mt-1">Sube GNM1 y genera el archivo Excel idéntico en **estilo visual, colores verde intercalados y firmas** a GNM2.</p>
    </div>
  </header>

  <main class="max-w-4xl mx-auto px-4 py-8 space-y-8">

    <!-- Cargar Archivo -->
    <section class="bg-white rounded-xl border border-slate-200 p-6 shadow-sm">
      <h2 class="text-lg font-bold text-slate-900 mb-4 flex items-center gap-2">
        <i data-lucide="upload-cloud" class="w-5 h-5 text-emerald-600"></i> Cargar Marcaciones Biométricas (GNM1)
      </h2>

      <div class="border-2 border-dashed border-slate-300 rounded-lg p-6 text-center hover:border-emerald-500 transition bg-slate-50">
        <input type="file" id="excelFile" accept=".xlsx, .xls" class="hidden" onchange="procesarBiometrico(event)" />
        <label for="excelFile" class="cursor-pointer flex flex-col items-center gap-2">
          <i data-lucide="file-up" class="w-10 h-10 text-slate-400"></i>
          <span class="text-sm font-semibold text-slate-700">Haz clic aquí para seleccionar el archivo GNM1.xlsx</span>
          <span class="text-xs text-slate-500">Separación por C.I. + formato gráfico verde idéntico a GNM2</span>
        </label>
      </div>

      <div id="statusMessage" class="hidden mt-4 p-3 rounded-lg text-sm"></div>
    </section>

    <!-- Vista Previa -->
    <section id="previewSection" class="hidden bg-white rounded-xl border border-slate-200 p-6 shadow-sm space-y-4">
      <div class="flex flex-col md:flex-row items-start md:items-center justify-between gap-4 border-b pb-3">
        <div>
          <h2 class="text-lg font-bold text-slate-900 flex items-center gap-2">
            <i data-lucide="check-circle" class="w-5 h-5 text-emerald-600"></i> Previsualización y Descarga
          </h2>
          <p id="totalPersonas" class="text-xs text-slate-500"></p>
        </div>
        <button onclick="descargarPlanillaGNM2Exacta()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-medium px-4 py-2 rounded-lg text-sm inline-flex items-center gap-2 transition shadow-sm">
          <i data-lucide="download" class="w-4 h-4"></i> Descargar Excel Formato GNM2
        </button>
      </div>

      <div class="flex items-center gap-3">
        <label for="ciSelector" class="text-sm font-medium text-slate-700">Ver C.I.:</label>
        <select id="ciSelector" onchange="cambiarVistaCI(this.value)" class="border rounded-lg p-2 text-sm bg-slate-50 focus:outline-none focus:ring-2 focus:ring-emerald-500">
        </select>
      </div>

      <!-- Tabla Estilizada como la imagen GNM2 -->
      <div class="overflow-x-auto max-h-96 border rounded-lg">
        <table class="w-full text-left text-sm border-collapse">
          <thead class="bg-white border-b-2 border-black sticky top-0 font-semibold text-slate-900">
            <tr>
              <th class="p-2 border border-black">Cedula No.</th>
              <th class="p-2 border border-black">Nombre</th>
              <th class="p-2 border border-black">Horario</th>
              <th class="p-2 border border-black">Retrasos</th>
              <th class="p-2 border border-black">Comision</th>
              <th class="p-2 border border-black">Observaciones</th>
            </tr>
          </thead>
          <tbody id="tableBody">
          </tbody>
        </table>
      </div>
    </section>

  </main>

  <script>
    lucide.createIcons();
    let agrupadoPorCI = {};

    function procesarBiometrico(event) {
      const file = event.target.files[0];
      if (!file) return;

      const status = document.getElementById('statusMessage');
      status.className = "mt-4 p-3 rounded-lg text-sm bg-blue-50 text-blue-700 block";
      status.innerText = "Procesando marcaciones y aplicando plantilla visual GNM2...";

      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const data = new Uint8Array(e.target.result);
          const workbook = XLSX.read(data, { type: 'array', cellDates: true });
          const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
          const rows = XLSX.utils.sheet_to_json(firstSheet, { header: 1 });

          agrupadoPorCI = {};

          for (let i = 0; i < rows.length; i++) {
            const row = rows[i];
            if (row && row[0] && row[1]) {
              const ci = String(row[0]).trim();
              let fechaHora = row[1];
              
              if (fechaHora instanceof Date) {
                const yyyy = fechaHora.getFullYear();
                const mm = String(fechaHora.getMonth() + 1).padStart(2, '0');
                const dd = String(fechaHora.getDate()).padStart(2, '0');
                const hh = String(fechaHora.getHours()).padStart(2, '0');
                const min = String(fechaHora.getMinutes()).padStart(2, '0');
                const ss = String(fechaHora.getSeconds()).padStart(2, '0');
                fechaHora = `${yyyy}-${mm}-${dd} ${hh}:${min}:${ss}`;
              }

              if (!agrupadoPorCI[ci]) {
                agrupadoPorCI[ci] = [];
              }

              agrupadoPorCI[ci].push({
                ci: ci,
                nombre: "",
                horario: fechaHora
              });
            }
          }

          const listaCIs = Object.keys(agrupadoPorCI);
          if (listaCIs.length === 0) throw new Error("Archivo vacío o sin datos válidos");

          poblarSelectorCI(listaCIs);
          cambiarVistaCI(listaCIs[0]);

          document.getElementById('totalPersonas').innerText = `Se exportarán ${listaCIs.length} pestañas con el estilo GNM2.`;
          status.className = "mt-4 p-3 rounded-lg text-sm bg-emerald-50 text-emerald-700 block";
          status.innerText = `¡Procesamiento completo! Se estructuraron ${listaCIs.length} C.I.`;
          document.getElementById('previewSection').classList.remove('hidden');

        } catch (err) {
          status.className = "mt-4 p-3 rounded-lg text-sm bg-red-50 text-red-700 block";
          status.innerText = "Error al leer el archivo. Verifica el formato de GNM1.xlsx.";
        }
      };
      reader.readAsArrayBuffer(file);
    }

    function poblarSelectorCI(listaCIs) {
      const selector = document.getElementById('ciSelector');
      selector.innerHTML = "";
      listaCIs.forEach(ci => {
        const option = document.createElement('option');
        option.value = ci;
        option.textContent = `C.I. ${ci} (${agrupadoPorCI[ci].length} marcaciones)`;
        selector.appendChild(option);
      });
    }

    function cambiarVistaCI(ci) {
      const tbody = document.getElementById('tableBody');
      tbody.innerHTML = "";
      const datosCI = agrupadoPorCI[ci] || [];

      datosCI.forEach((row, index) => {
        const tr = document.createElement('tr');
        // Alternar el color verde pastel idéntico a la imagen de GNM2
        const isGreen = index % 2 === 0;
        const bgStyle = isGreen ? 'style="background-color: #00B050; color: white;"' : 'style="background-color: #ffffff; color: black;"';

        tr.innerHTML = `
          <td class="p-2 border border-black font-medium">${row.ci}</td>
          <td class="p-2 border border-black">${row.nombre}</td>
          <td class="p-2 border border-black" ${bgStyle}>${row.horario}</td>
          <td class="p-2 border border-black"></td>
          <td class="p-2 border border-black"></td>
          <td class="p-2 border border-black"></td>
        `;
        tbody.appendChild(tr);
      });
    }

    async function descargarPlanillaGNM2Exacta() {
      const listaCIs = Object.keys(agrupadoPorCI);
      if (listaCIs.length === 0) return;

      const wb = new ExcelJS.Workbook();

      listaCIs.forEach(ci => {
        const ws = wb.addWorksheet(ci.substring(0, 31));

        // Anchos de columna
        ws.columns = [
          { header: 'Cedula No.', key: 'ci', width: 15 },
          { header: 'Nombre', key: 'nombre', width: 28 },
          { header: 'Horario', key: 'horario', width: 22 },
          { header: 'Retrasos', key: 'retrasos', width: 12 },
          { header: 'Comision', key: 'comision', width: 12 },
          { header: 'Observaciones', key: 'observaciones', width: 20 }
        ];

        // Estilo de encabezado (Fila 1)
        const headerRow = ws.getRow(1);
        headerRow.font = { bold: true, size: 10 };
        headerRow.alignment = { vertical: 'middle', horizontal: 'center' };
        headerRow.eachCell((cell) => {
          cell.border = {
            top: { style: 'thin', color: { argb: 'FF000000' } },
            left: { style: 'thin', color: { argb: 'FF000000' } },
            bottom: { style: 'thin', color: { argb: 'FF000000' } },
            right: { style: 'thin', color: { argb: 'FF000000' } }
          };
        });

        // Insertar filas de marcaciones intercaladas con VERDE (Idéntico a GNM2)
        const marcaciones = agrupadoPorCI[ci];
        marcaciones.forEach((m, idx) => {
          const rowNum = idx + 2;
          const row = ws.getRow(rowNum);
          row.getCell(1).value = m.ci;
          row.getCell(2).value = m.nombre;
          row.getCell(3).value = m.horario;

          // Bordes de celda completos
          for (let col = 1; col <= 6; col++) {
            const cell = row.getCell(col);
            cell.border = {
              top: { style: 'thin', color: { argb: 'FF000000' } },
              left: { style: 'thin', color: { argb: 'FF000000' } },
              bottom: { style: 'thin', color: { argb: 'FF000000' } },
              right: { style: 'thin', color: { argb: 'FF000000' } }
            };
          }

          // Relleno Verde en la celda de 'Horario' intercalado (par/impar) como en la captura
          if (idx % 2 === 0) {
            row.getCell(3).fill = {
              type: 'pattern',
              pattern: 'solid',
              fgColor: { argb: 'FF00B050' } // Verde original de GNM2
            };
          }
        });

        // Pie de página idéntico al del archivo GNM2 (Aclaración de Feriados y Firmas)
        const lastDataRow = marcaciones.length + 2;
        
        // Fila de NOTA / Aclaración
        const notaRow = ws.getRow(lastDataRow + 1);
        notaRow.getCell(1).value = "NOTA .-";
        notaRow.getCell(2).value = "LA CONSULTORA INDIVIDUAL DE LINEA TRABAJA EN OFICINAS DE UJJRAE EN LA CALLE COLOMBIA ENTRE CALLE ESPAÑA Y CALLE 25 DE MAYO- MUNICIPIO DE COCHABAMBA, DE LUNES A VIERNES DE 08:00 A 16:00.\n\n- ACLARAR QUE EN FECHA JUEVES 06 - VIERNES 07/08/2026 EL MINISTERIO DE TRABAJO DISPUSO FERIADO NACIONAL POR EL EL DIA DE LA INDEPENDENCIA DE BOLIVIA.\n- ACLARAR QUE EN FECHA VIERNES 14/08/2026 EL GADC DISPUSO FERIADO DEPARTAMENTAL POR LA FESTIVIDAD DE URKUPIÑA";

        // Fila de Firmas Institucionales
        const firmaRow = ws.getRow(lastDataRow + 10);
        firmaRow.getCell(1).value = "JOSE LAMAS ROJAS\nADMINISTRADOR COMETA";
        firmaRow.getCell(4).value = "LUIS ANDY YANIQUEZ VILLARROEL\nSUPERVISOR CONSULTORIA DE LINEA";
      });

      // Exportar y descargar archivo Excel completo
      const buffer = await wb.xlsx.writeBuffer();
      const blob = new Blob([buffer], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
      const url = window.URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = "Planilla_Asistencia_GNM2_Identico.xlsx";
      a.click();
      window.URL.revokeObjectURL(url);
    }
  </script>
</body>
</html>
